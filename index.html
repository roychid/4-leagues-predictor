<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Poisson Predictor</title>
<style>
body{background:#0b0b0b;color:#eee;font-family:sans-serif;padding:20px}
.card{background:#111;padding:12px;border-radius:8px;margin-bottom:10px}
button{background:#00ff00;color:#000;border:none;padding:8px;border-radius:6px;cursor:pointer}
.prob-bar{display:flex;height:10px;width:100%;background:#222;border-radius:6px;overflow:hidden;margin-top:6px}
.prob{height:100%}
</style>
</head>
<body>
<h1>Poisson Predictor - SportMonks</h1>

<div class="card">
  <label>League</label>
  <select id="league">
    <option value="">All</option>
    <optgroup label="🇩🇰 Denmark">
      <option value="271">Superliga</option>
      <option value="1659">Play-offs</option>
    </optgroup>
    <optgroup label="🏴 Scotland">
      <option value="501">Premiership</option>
      <option value="513">Play-offs</option>
    </optgroup>
  </select>
  <label>Date</label>
  <input type="date" id="date">
  <button id="loadBtn">Load Matches</button>
</div>

<div id="matches"></div>

<script>
async function loadFixtures(league,date){
  const res = await fetch(`/api/fixtures?date=${date}&league=${league}`);
  const data = await res.json();
  return data.fixtures || [];
}

async function predict(fixture){
  const res = await fetch('/api/predict',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({fixture})
  });
  return res.json();
}

document.getElementById('loadBtn').addEventListener('click',async()=>{
  const league=document.getElementById('league').value;
  const date=document.getElementById('date').value;
  const matchesDiv=document.getElementById('matches');
  matchesDiv.innerHTML='Loading fixtures...';
  const fixtures=await loadFixtures(league,date);
  matchesDiv.innerHTML='';
  for(const f of fixtures){
    const card=document.createElement('div'); card.className='card';
    card.innerHTML=`<strong>${f.home} vs ${f.away}</strong><div>${new Date(f.fixtureDate).toLocaleString()}</div>`;
    matchesDiv.appendChild(card);
  }
  // fetch predictions in parallel
  const predictions = await Promise.all(fixtures.map(f=>predict(f)));
  fixtures.forEach((f,i)=>{
    const card=matchesDiv.children[i];
    const p=predictions[i];
    card.innerHTML+=`<div class="prob-bar">
      <div class="prob" style="width:${Math.round(p.probabilities.home*100)}%;background:#00ff00"></div>
      <div class="prob" style="width:${Math.round(p.probabilities.draw*100)}%;background:#888"></div>
      <div class="prob" style="width:${Math.round(p.probabilities.away*100)}%;background:#fff"></div>
    </div>
    <div>Recommendation: ${p.recommendation} (Confidence: ${p.confidence}%)</div>
    <div>Used History: ${p.used_history_count}</div>`;
  });
});
</script>
</body>
</html>
